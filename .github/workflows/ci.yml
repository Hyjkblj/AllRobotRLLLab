name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  python:
    name: Python contracts and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: allrobotrl
          POSTGRES_USER: allrobotrl
          POSTGRES_PASSWORD: allrobotrl_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U allrobotrl -d allrobotrl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-platform.txt
      - name: Install platform dependencies
        run: python -m pip install -r requirements-platform.txt
      - name: Verify repository boundary
        run: python scripts/check_repo_boundary.py
      - name: Check whitespace
        run: git diff --check
      - name: Compile Python modules
        run: python -m compileall -q adapters apps backend packages scripts
      - name: Run tests with PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://allrobotrl:allrobotrl_ci@127.0.0.1:5432/allrobotrl
        run: python -m pytest -q
      - name: Validate Compose files
        run: docker compose -f infra/compose/docker-compose.p2.yml config

  frontend:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-prototype/react-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-prototype/react-app/package-lock.json
      - run: npm ci
      - run: npm run build
