services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-allrobotrl}
      POSTGRES_USER: ${POSTGRES_USER:-allrobotrl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - staging-postgres:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - staging-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    volumes:
      - staging-minio:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      && mc mb --ignore-existing "local/$${MINIO_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      MINIO_BUCKET: ${MINIO_BUCKET:-allrobotrl}

  migrate:
    image: ${PLATFORM_IMAGE:-allrobotrl-platform:${IMAGE_TAG:-local}}
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: staging
      PLATFORM_ROLE: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-allrobotrl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-allrobotrl}
    command: ["python", "-c", "import os; from pathlib import Path; from backend.app.infrastructure.postgres import PostgresDatabase; PostgresDatabase(os.environ['DATABASE_URL']).apply_migrations(Path('/app/infra/migrations'))"]

  api:
    image: ${PLATFORM_IMAGE:-allrobotrl-platform:${IMAGE_TAG:-local}}
    build:
      context: ../..
      dockerfile: infra/docker/platform.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: staging
      PLATFORM_ROLE: worker-cpu
      DATABASE_URL: postgresql://${POSTGRES_USER:-allrobotrl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-allrobotrl}
      REDIS_URL: redis://redis:6379/0
      EXECUTION_MODE: async
      P3_BACKEND: ${P3_BACKEND:-isaac_lab}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-allrobotrl}
      MINIO_SECURE: "false"
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN must be set}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - staging-runtime:/app/.runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-cpu:
    image: ${PLATFORM_IMAGE:-allrobotrl-platform:${IMAGE_TAG:-local}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: staging
      PLATFORM_ROLE: worker-gpu
      DATABASE_URL: postgresql://${POSTGRES_USER:-allrobotrl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-allrobotrl}
      REDIS_URL: redis://redis:6379/0
      EXECUTION_MODE: async
      P3_BACKEND: ${P3_BACKEND:-isaac_lab}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-allrobotrl}
      MINIO_SECURE: "false"
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN must be set}
    volumes:
      - staging-runtime:/app/.runtime
    command: ["celery", "-A", "backend.app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "cpu,asset-io,motion-cpu"]

  worker-gpu:
    profiles: ["gpu"]
    image: ${PLATFORM_IMAGE:-allrobotrl-platform:${IMAGE_TAG:-local}}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql://${POSTGRES_USER:-allrobotrl}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-allrobotrl}
      REDIS_URL: redis://redis:6379/0
      EXECUTION_MODE: async
      P3_BACKEND: ${P3_BACKEND:-isaac_lab}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-allrobotrl}
      MINIO_SECURE: "false"
      WORKER_AUTH_TOKEN: ${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN must be set}
      ISAACLAB_PATH: /opt/IsaacLab
      ISAACSIM_PATH: /opt/IsaacSim
      GMR_PATH: /opt/GMR
      GVHMR_PATH: /opt/GVHMR
      UNITREE_MUJOCO_PATH: /opt/unitree_mujoco
      UNITREE_RL_LAB_PATH: /opt/unitree_rl_lab
      G1_MJCF_PATH: /opt/GMR/assets/unitree_g1/g1_mocap_29dof.xml
    volumes:
      - staging-runtime:/app/.runtime
      - ${ISAACLAB_PATH:-/opt/IsaacLab}:/opt/IsaacLab:ro
      - ${ISAACSIM_PATH:-/opt/IsaacSim}:/opt/IsaacSim:ro
      - ${GMR_PATH:-/opt/GMR}:/opt/GMR:ro
      - ${GVHMR_PATH:-/opt/GVHMR}:/opt/GVHMR:ro
      - ${UNITREE_MUJOCO_PATH:-/opt/unitree_mujoco}:/opt/unitree_mujoco:ro
      - ${UNITREE_RL_LAB_PATH:-/opt/unitree_rl_lab}:/opt/unitree_rl_lab:ro
    gpus: all
    command: ["celery", "-A", "backend.app.workers.celery_app:celery_app", "worker", "--loglevel=INFO", "-Q", "isaac-gpu,sim2sim-gpu,motion-gpu", "--concurrency=1"]

volumes:
  staging-postgres:
  staging-redis:
  staging-minio:
  staging-runtime:
