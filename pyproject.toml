[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allrobotrl-platform"
version = "0.1.0"
description = "Layered contracts and orchestration foundation for the G1 RL platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
  "numpy>=1.26,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8.3,<9"]
infra = [
  "psycopg[binary]>=3.2,<4",
  "celery>=5.4,<6",
  "redis>=5,<7",
  "minio>=7.2,<8",
]
p3 = [
  "torch==2.7.0",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
  "ml-dtypes==0.5.4",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.setuptools.packages.find]
include = ["backend*", "packages*"]
